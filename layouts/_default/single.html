{{ define "main" }}
<article class="prose">
    <header class="article-header">
        <h1>{{ .Title }}</h1>
        <div class="article-meta">
            {{ if ne .Params.showDate false }}
            <span>{{ .Date.Format "January 2, 2006" }}</span>
            {{ end }}
            {{ if .Params.tags }}
            <span>•</span>
            <div class="tags">
                {{ range .Params.tags }}
                <span class="tag">{{ . }}</span>
                {{ end }}
            </div>
            {{ end }}
        </div>
    </header>

    <div class="article-content">
        {{ .Content }}
    </div>
</article>
{{ end }}
